# Render blueprint for the backend: New -> Blueprint -> pick this repo. Render asks for every value marked
# sync: false; those are secrets and live only in Render, never in git.
services:
  - type: web
    name: babylon-pack-station
    runtime: python
    plan: free
    region: singapore  # closest Render region to the Supabase database (Seoul)
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # one worker on purpose: the per-order locks live in the process
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Supabase: use the "Session pooler" connection string (Render has no IPv6). Write @ in the password as %40.
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: babylon
      - key: AUTH
        value: supabase
      - key: SUPABASE_URL
        value: https://mnhaibeqomrifpvyzujw.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      # Shopify test store, taking orders
      - key: SHOPIFY_MODE
        value: live
      - key: SHOPIFY_SHOP
        value: toolbox-test-2.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: BABYLON_LOCATION_ID
        value: gid://shopify/Location/85797830817
      - key: UFSI_LOCATION_ID
        value: gid://shopify/Location/78134116513
      - key: CLAIM_MODE
        value: live
      - key: POLL_SECONDS
        value: "60"
      - key: SYNC_SECONDS
        value: "0"
      - key: ALLOW_MOCK_SYNC
        value: "1"
      # keeps the free instance awake while it runs (it pings its own RENDER_EXTERNAL_URL/healthz)
      - key: KEEPALIVE_SECONDS
        value: "600"
      # not connected yet
      - key: ODOO_MODE
        value: mock
      - key: DEPOSCO_MODE
        value: "off"
      - key: EASYPOST_MODE
        value: mock
      - key: PRINTER_MODE
        value: file
      # labels
      - key: SHIP_FROM_NAME
        value: Babylon LLC
      - key: SHIP_FROM_STREET1
        value: 2221 Oakland Rd
      - key: SHIP_FROM_CITY
        value: San Jose
      - key: SHIP_FROM_STATE
        value: CA
      - key: SHIP_FROM_ZIP
        value: "95131"
      - key: SHIP_FROM_PHONE
        value: "4158149788"
